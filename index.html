// ===== GRID CORE (5×5, expandable) =====
class Grid {
  constructor(cols = 5, rows = 8) {
    this.cols = cols
    this.rows = rows
    this.cells = []
    this.reset()
  }

  reset() {
    this.cells = Array.from({ length: this.rows }, () => Array(this.cols).fill(0))
  }

  clone() {
    const g = new Grid(this.cols, this.rows)
    g.cells = this.cells.map(r => [...r])
    return g
  }

  // ===== 基礎操作 =====

  /** 投放方塊到指定列，返回落地的行號（-1=滿了） */
  drop(col, value) {
    if (col < 0 || col >= this.cols) return -1
    if (this.cells[0][col] !== 0) return -1

    let targetRow = -1
    for (let r = this.rows - 1; r >= 0; r--) {
      if (this.cells[r][col] === 0) { targetRow = r; break }
    }
    if (targetRow === -1) return -1

    this.cells[targetRow][col] = value
    return targetRow
  }

  /** 重力 — 所有方塊往下落 */
  applyGravity() {
    const moved = []
    for (let c = 0; c < this.cols; c++) {
      const vals = []
      for (let r = 0; r < this.rows; r++) {
        if (this.cells[r][c] !== 0) vals.push(this.cells[r][c])
      }
      for (let r = this.rows - 1; r >= 0; r--) {
        const idx = vals.length - (this.rows - r)
        const newVal = idx >= 0 ? vals[idx] : 0
        if (newVal !== this.cells[r][c]) moved.push({ r, c })
        this.cells[r][c] = newVal
      }
    }
    return moved
  }

  // ===== 合併系統 =====

  /** BFS 找相鄰同值群組，返回大小≥3的群組 */
  findGroups() {
    const visited = Array.from({ length: this.rows }, () => Array(this.cols).fill(false))
    const groups = []

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.cells[r][c] === 0 || visited[r][c]) continue

        const value = this.cells[r][c]
        const group = []
        const queue = [{ r, c }]
        visited[r][c] = true

        while (queue.length > 0) {
          const cur = queue.shift()
          group.push(cur)

          for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
            const nr = cur.r + dr, nc = cur.c + dc
            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols
              && !visited[nr][nc] && this.cells[nr][nc] === value) {
              visited[nr][nc] = true
              queue.push({ r: nr, c: nc })
            }
          }
        }

        if (group.length >= 3) {
          groups.push({ cells: group, value })
        }
      }
    }

    return groups
  }

  /**
   * 處理合併 — 返回 { score, chains, events }
   * 自動處理連鎖反應直到沒有新群組
   */
  processMerges() {
    let totalScore = 0
    let chains = 0
    const events = []

    while (true) {
      const groups = this.findGroups()
      if (groups.length === 0) break

      chains++
      const cleared = [] // 所有被清除的格子（用於粒子特效）

      for (const group of groups) {
        const newValue = group.value + 1

        // 找錨點：最底部、然後最左邊
        let anchor = group.cells[0]
        for (const cell of group.cells) {
          if (cell.r > anchor.r || (cell.r === anchor.r && cell.c < anchor.c)) {
            anchor = cell
          }
        }

        // 記錄被清除的位置
        for (const { r, c } of group.cells) {
          cleared.push({ r, c, value: group.value })
          this.cells[r][c] = 0
        }

        // 放置合併後的方塊
        this.cells[anchor.r][anchor.c] = newValue

        // 計分: 新值 × 消除數量 × 連鎖倍率
        const chainMultiplier = 1 + (chains - 1) * 0.5
        const groupScore = Math.floor(newValue * newValue * group.cells.length * chainMultiplier)
        totalScore += groupScore

        events.push({
          anchor: { ...anchor },
          newValue,
          cleared: [...cleared],
          chain: chains,
          score: groupScore,
          groupSize: group.cells.length,
        })
      }

      this.applyGravity()
    }

    return { score: totalScore, chains, events }
  }

  // ===== 遊戲狀態 =====

  /** 某列是否已滿 */
  isColFull(c) {
    return this.cells[0][c] !== 0
  }

  /** 是否 Game Over（所有列都滿了） */
  isGameOver() {
    for (let c = 0; c < this.cols; c++) {
      if (this.cells[0][c] === 0) return false
    }
    return true
  }

  /** 棋盤上的最大值 */
  getMaxValue() {
    let max = 0
    for (const row of this.cells) for (const v of row) if (v > max) max = v
    return max
  }

  /** 非空方塊數量 */
  getCount() {
    let n = 0
    for (const row of this.cells) for (const v of row) if (v > 0) n++
    return n
  }

  // ===== 道具效果 =====

  /** 炸彈 — 清除以 (r,c) 為中心的 3x3 區域 */
  bomb(r, c) {
    const cleared = []
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc
        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols && this.cells[nr][nc] > 0) {
          cleared.push({ r: nr, c: nc, value: this.cells[nr][nc] })
          this.cells[nr][nc] = 0
        }
      }
    }
    this.applyGravity()
    return cleared
  }

  /** 洗牌 — 隨機打亂所有方塊位置 */
  shuffle() {
    const values = []
    const positions = []
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.cells[r][c] > 0) {
          values.push(this.cells[r][c])
          positions.push({ r, c })
        }
      }
    }
    // Fisher-Yates
    for (let i = values.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [values[i], values[j]] = [values[j], values[i]]
    }
    // 先清空再放回
    for (const p of positions) this.cells[p.r][p.c] = 0
    for (let i = 0; i < positions.length; i++) {
      this.cells[positions[i].r][positions[i].c] = values[i]
    }
    this.applyGravity()
  }
  /** 錘子 — 消除選中的一格 */
  hammer(r, c) {
    if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return []
    if (this.cells[r][c] === 0) return []
    const v = this.cells[r][c]
    this.cells[r][c] = 0
    this.applyGravity()
    return [{ r, c, value: v }]
  }

  /** 閃電 — 消除所有與選中格相同值的方塊 */
  lightning(r, c) {
    if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return []
    const target = this.cells[r][c]
    if (target === 0) return []
    const cleared = []
    for (let ri = 0; ri < this.rows; ri++) {
      for (let ci = 0; ci < this.cols; ci++) {
        if (this.cells[ri][ci] === target) {
          cleared.push({ r: ri, c: ci, value: target })
          this.cells[ri][ci] = 0
        }
      }
    }
    this.applyGravity()
    return cleared
  }

  /** 加一列 */
  expandCol() {
    this.cols++
    for (let r = 0; r < this.rows; r++) this.cells[r].push(0)
  }

  /** 加一行（頂部） */
  expandRow() {
    this.rows++
    this.cells.unshift(Array(this.cols).fill(0))
  }

}

// ===== PARTICLES =====
class ParticleSystem {
  constructor(){this.particles=[]}
  emit(x,y,color,value=2){
    const count=8+value*2, speed=1.5+value*0.5, sz=2+value*0.3
    const colors=this._pal(value)
    for(let i=0;i<count;i++){
      const a=(Math.PI*2*i)/count+(Math.random()-.5)*.5, v=speed*(.5+Math.random())
      this.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.015+Math.random()*.02,size:sz*(.6+Math.random()*.8),color:colors[Math.floor(Math.random()*colors.length)],gravity:.03+Math.random()*.02})
    }
  }
  emitRainbow(x,y){
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2, v=2+Math.random()*3, hue=(i*12)%360
      this.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.008+Math.random()*.01,size:3+Math.random()*3,color:`hsl(${hue},100%,60%)`,gravity:.02})
    }
  }
  _pal(v){
    const tc=TILE_COLORS[v]
    if(!tc)return['#fff']
    return[tc.bg1,tc.bg2||tc.bg1,'#fff',tc.bg1+'88']
  }
  update(){
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=.98;p.life-=p.decay
      if(p.life<=0)this.particles.splice(i,1)
    }
  }
  draw(ctx){
    for(const p of this.particles){
      ctx.save();ctx.globalAlpha=p.life
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=p.size*2
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill()
      ctx.restore()
    }
  }
  clear(){this.particles=[]}
}

const particles = new ParticleSystem()

// ===== STORAGE =====
const S={
  _g(k){try{return JSON.parse(localStorage.getItem('nb2_'+k))}catch{return null}},
  _s(k,v){try{localStorage.setItem('nb2_'+k,JSON.stringify(v))}catch{}},
  // Items
  getItems(){return this._g('items')||{hammer:1,shuffle:1,lightning:0}},
  saveItems(i){this._s('items',i)},
  useItem(t){const i=this.getItems();if((i[t]||0)<=0)return false;i[t]--;this.saveItems(i);return true},
  addItem(t,n){const i=this.getItems();i[t]=(i[t]||0)+n;this.saveItems(i)},
  // Theme
  getTheme(){return this._g('theme')||'classic'},
  setTheme(t){this._s('theme',t)},
  getUnlockedThemes(){return this._g('unlocked')||['classic']},
  unlockTheme(id){const u=this.getUnlockedThemes();if(u.includes(id))return false;u.push(id);this._s('unlocked',u);return true},
  // Best scores
  getBestEndless(){return this._g('best_endless')||0},
  setBestEndless(s){if(s>this.getBestEndless())this._s('best_endless',s)},
  // Stats
  getStats(){return this._g('stats')||{gamesPlayed:0,maxTile:0,maxCombo:0,totalRainbows:0}},
  saveStats(s){this._s('stats',s)},
  // Daily
  getDaily(){
    const today=new Date().toISOString().slice(0,10)
    const d=this._g('daily')
    if(!d||d.date!==today){
      const seed=today.split('-').reduce((a,b)=>a+parseInt(b),0)
      const challenges=[
        {desc:'合成藍色方塊',type:'tile',target:6},
        {desc:'合成紫色方塊',type:'tile',target:7},
        {desc:'達到500分',type:'score',target:500},
        {desc:'達到1000分',type:'score',target:1000},
        {desc:'達成3連擊',type:'combo',target:3},
        {desc:'合成金色方塊',type:'tile',target:8},
        {desc:'達到800分',type:'score',target:800},
      ]
      const ch={date:today,challenge:challenges[seed%challenges.length],completed:false,attempts:3,expandedRow:false,expandedCol:false}
      this._s('daily',ch);return ch
    }
    return d
  },
  saveDaily(d){this._s('daily',d)},
  // Leaderboard (local)
  getLB(){return this._g('lb')||[]},
  addLB(mode,score,extra){
    const lb=this.getLB()
    lb.push({mode,score,...extra,ts:Date.now()})
    lb.sort((a,b)=>b.score-a.score)
    this._s('lb',lb.slice(0,20))
  },
  getDailyStreak(){
    const d=this._g('streak')||{count:0,lastDate:''}
    const today=new Date().toISOString().slice(0,10)
    if(d.lastDate===today) return d.count
    const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10)
    if(d.lastDate===yesterday) return d.count
    return 0
  },
  addDailyStreak(){
    const today=new Date().toISOString().slice(0,10)
    const d=this._g('streak')||{count:0,lastDate:''}
    const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10)
    if(d.lastDate===today) return d.count
    let count = d.lastDate===yesterday ? d.count+1 : 1
    this._s('streak',{count,lastDate:today})
    return count
  },
}

// ===== LAYOUT (dynamic, recalculated) =====
let COLS, ROWS, margin, headerH, previewH, boardTop, boardW, cellGap, cellW, cellH, boardH, boardX, itemBarH, backBtnH, bottomPad

function recalcLayout() {
  COLS = grid.cols; ROWS = grid.rows
  margin = 8
  headerH = Math.min(85, Math.floor(H * 0.1))
  previewH = Math.min(48, Math.floor(H * 0.06))
  itemBarH = 48; backBtnH = 32; bottomPad = 10
  boardTop = headerH + previewH + 4
  boardW = W - margin * 2
  cellGap = 3
  const cwW = Math.floor((boardW - cellGap * (COLS + 1)) / COLS)
  const availH = H - boardTop - itemBarH - backBtnH - bottomPad - 20
  const cwH = Math.floor((availH - cellGap * (ROWS + 1)) / ROWS)
  const cs = Math.max(20, Math.min(cwW, cwH))
  cellW = cs; cellH = cs
  boardH = cellH * ROWS + cellGap * (ROWS + 1)
  boardX = margin
}
recalcLayout()

// ===== DRAW HELPERS =====
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r)
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h)
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()
}

function drawBtn(x,y,w,h,color,radius,alpha){
  ctx.save()
  if(alpha)ctx.globalAlpha=alpha
  ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=4;ctx.shadowOffsetY=2
  ctx.fillStyle=color;rr(x,y,w,h,radius||8);ctx.fill()
  ctx.restore()
}

function drawBg(t){
  const g=ctx.createLinearGradient(0,0,0,H)
  g.addColorStop(0,t.bg1);g.addColorStop(1,t.bg2)
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H)
}

function drawTile(x, y, w, h, value, t, radius) {
  const tc = TILE_COLORS[value] || {bg1:'#555',bg2:'#333'}
  const r = radius || 6

  // Outer glow for special tiles
  if (tc.glow) {
    ctx.save()
    ctx.shadowColor = tc.glow; ctx.shadowBlur = 18
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0
    ctx.fillStyle = tc.glow
    rr(x - 2, y - 2, w + 4, h + 4, r + 2); ctx.fill()
    ctx.restore()
  }

  // Shadow + gradient
  ctx.save()
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2
  const grad = ctx.createLinearGradient(x, y, x, y + h)
  grad.addColorStop(0, tc.bg1); grad.addColorStop(1, tc.bg2 || tc.bg1)
  ctx.fillStyle = grad; rr(x, y, w, h, r); ctx.fill()
  ctx.restore()

  // Shine
  ctx.save()
  const shine = ctx.createLinearGradient(x, y, x, y + h * 0.45)
  shine.addColorStop(0, 'rgba(255,255,255,0.4)'); shine.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = shine; rr(x, y, w, h * 0.45, r); ctx.fill()
  ctx.restore()

  const cx = x + w / 2, cy = y + h / 2
  if (value === 8) {
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.5)'
    ctx.font = `${Math.floor(w * 0.45)}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText('★', cx, cy); ctx.restore()
  } else if (value === 9) {
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.6)'
    ctx.beginPath()
    ctx.moveTo(cx, cy - h * 0.3); ctx.lineTo(cx + w * 0.25, cy)
    ctx.lineTo(cx, cy + h * 0.3); ctx.lineTo(cx - w * 0.25, cy)
    ctx.closePath(); ctx.fill()
    ctx.restore()
  } else if (value === 10) {
    ctx.save()
    const rainbow = ctx.createLinearGradient(x, y, x + w, y + h)
    rainbow.addColorStop(0, 'rgba(255,100,100,0.25)'); rainbow.addColorStop(0.33, 'rgba(100,255,100,0.25)')
    rainbow.addColorStop(0.66, 'rgba(100,100,255,0.25)'); rainbow.addColorStop(1, 'rgba(255,255,100,0.25)')
    ctx.fillStyle = rainbow; rr(x, y, w, h, r); ctx.fill()
    ctx.fillStyle = 'rgba(255,255,255,0.6)'
    ctx.font = `${Math.floor(w * 0.45)}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText('♛', cx, cy); ctx.restore()
  }
}

// ===== GAME LOGIC =====

function startGame(m) {
  mode = m
  grid = new Grid(5, 5)
  score = 0; moves = 0; maxCombo = 0; rainbowCount = 0
  currentPiece = randPiece(); nextPiece = randPiece()
  itemSelectType = null
  dailyExpandedRow = false; dailyExpandedCol = false
  recalcLayout()
  if (mode === 'daily') {
    const daily = S.getDaily()
    // Reset expansion state for fresh attempt
    dailyExpandedRow = false; dailyExpandedCol = false
  }
  state = 'playing'
}

function doDrop(col) {
  if (state !== 'playing') return
  const row = grid.drop(col, currentPiece)
  if (row === -1) return // column full, ignore
  moves++

  const prevRainbow = countRainbow()
  const result = grid.processMerges()
  const newRainbow = countRainbow()

  if (result.score > 0) {
    score += result.score
    if (result.chains > maxCombo) maxCombo = result.chains
    // Particles at merge location
    for (const ev of result.events) {
      const x = boardX + cellGap + ev.anchor.c * (cellW + cellGap) + cellW / 2
      const y = boardTop + cellGap + ev.anchor.r * (cellH + cellGap) + cellH / 2
      particles.emit(x, y, null, ev.newValue)
      if (ev.chain > 1) particles.emit(x, y, null, ev.chain + 5)
    }
    if (result.chains >= 3) addToast(`⚡ ${result.chains}連擊！`, '💥')
  }

  // Rainbow tracking
  if (newRainbow > prevRainbow) {
    rainbowCount += (newRainbow - prevRainbow)
    for (let i = prevRainbow; i < newRainbow; i++) {
      addToast(`👑 彩虹方塊！(${rainbowCount})`, '🎉')
      particles.emitRainbow(W / 2, H / 2)
    }
  }

  currentPiece = nextPiece
  nextPiece = randPiece()

  // Check daily challenge completion
  if (mode === 'daily') checkDailyComplete()

  // Check game over
  if (grid.isGameOver()) endGame()
}

function countRainbow() {
  let n = 0
  for (const row of grid.cells) for (const v of row) if (v === 10) n++
  return n
}

function checkDailyComplete() {
  const daily = S.getDaily()
  const ch = daily.challenge
  let passed = false
  if (ch.type === 'tile' && grid.getMaxValue() >= ch.target) passed = true
  if (ch.type === 'score' && score >= ch.target) passed = true
  if (ch.type === 'combo' && maxCombo >= ch.target) passed = true
  if (passed) {
    daily.completed = true
    S.saveDaily(daily)
    S.addDailyStreak()
    // Reward items
    S.addItem('hammer', 1); S.addItem('shuffle', 1); S.addItem('lightning', 1)
    addToast('🎁 獲得道具獎勵！', '✅')
    state = 'gameover' // show victory screen
  }
}

function endGame() {
  state = 'gameover'
  // Save stats
  const stats = S.getStats()
  stats.gamesPlayed++
  if (grid.getMaxValue() > stats.maxTile) stats.maxTile = grid.getMaxValue()
  if (maxCombo > stats.maxCombo) stats.maxCombo = maxCombo
  stats.totalRainbows = (stats.totalRainbows || 0) + rainbowCount
  S.saveStats(stats)

  if (mode === 'endless') {
    S.setBestEndless(score)
    // Unlock themes based on rainbow count
    const unlocked = S.getUnlockedThemes()
    for (const th of THEMES) {
      if (th.rainbow > 0 && rainbowCount >= th.rainbow && !unlocked.includes(th.id)) {
        if (S.unlockTheme(th.id)) {
          addToast(`🎨 解鎖主題: ${th.icon} ${th.name}！`, '🎉')
        }
      }
    }
    S.addLB('endless', score, { rainbow: rainbowCount, maxTile: grid.getMaxValue() })
  }
  if (mode === 'daily') {
    const daily = S.getDaily()
    daily.attempts--
    S.saveDaily(daily)
    if (!daily.completed) {
      S.addLB('daily', 0, { passed: false })
    }
  }
}

function useItemAction(type) {
  if (type === 'hammer' || type === 'lightning') {
    if (!S.useItem(type)) { addToast('道具不足！', '❌'); return }
    itemSelectType = type
    state = 'item_select'
  } else if (type === 'shuffle') {
    if (!S.useItem('shuffle')) { addToast('道具不足！', '❌'); return }
    grid.shuffle()
    addToast('🔀 洗牌完成！', '✅')
    // Check for merges after shuffle
    const result = grid.processMerges()
    if (result.score > 0) score += result.score
    if (grid.isGameOver()) endGame()
  }
}

function doItemTarget(r, c) {
  if (itemSelectType === 'hammer') {
    const cleared = grid.hammer(r, c)
    if (cleared.length > 0) {
      const x = boardX + cellGap + c * (cellW + cellGap) + cellW / 2
      const y = boardTop + cellGap + r * (cellH + cellGap) + cellH / 2
      particles.emit(x, y, null, cleared[0].value)
      addToast('🔨 消除！', '✅')
    }
  } else if (itemSelectType === 'lightning') {
    const cleared = grid.lightning(r, c)
    if (cleared.length > 0) {
      for (const cell of cleared) {
        const x = boardX + cellGap + cell.c * (cellW + cellGap) + cellW / 2
        const y = boardTop + cellGap + cell.r * (cellH + cellGap) + cellH / 2
        particles.emit(x, y, null, cell.value)
      }
      addToast(`⚡ 消除 ${cleared.length} 個同色！`, '✅')
    }
  }
  itemSelectType = null
  state = 'playing'
  // Process any merges
  const result = grid.processMerges()
  if (result.score > 0) score += result.score
  if (grid.isGameOver()) endGame()
}

function dailyContinue(what) {
  const daily = S.getDaily()
  if (what === 'row' && !dailyExpandedRow) {
    grid.expandRow(); dailyExpandedRow = true
    addToast('↕️ 棋盤擴展 +1行！', '✅')
  } else if (what === 'col' && !dailyExpandedCol) {
    grid.expandCol(); dailyExpandedCol = true
    addToast('↔️ 棋盤擴展 +1列！', '✅')
  }
  recalcLayout()
  state = 'playing'
}

function addToast(text, icon) {
  toasts.push({ text, icon, time: Date.now() })
  if (toasts.length > 3) toasts.shift()
}

// ===== INPUT =====

function handleClick(x, y) {
  if (state === 'menu') handleMenuClick(x, y)
  else if (state === 'playing') handlePlayClick(x, y)
  else if (state === 'item_select') handleItemSelectClick(x, y)
  else if (state === 'gameover') handleGameOverClick(x, y)
  else if (state === 'leaderboard') handleBackOnly(x, y)
  else if (state === 'themes') handleThemesClick(x, y)
}

function handleMenuClick(x, y) {
  const bw = W - 60, bh = 65, startX = 30, startY = 130
  const daily = S.getDaily()

  // Daily button
  if (x >= startX && x <= startX + bw && y >= startY && y <= startY + bh) {
    if (!daily.completed && daily.attempts > 0) startGame('daily')
    else if (daily.attempts <= 0) addToast('今日次數已用完', '❌')
    return
  }
  // Endless button
  if (x >= startX && x <= startX + bw && y >= startY + bh + 15 && y <= startY + bh * 2 + 15) {
    startGame('endless'); return
  }
  // Theme button
  const bbY = startY + bh * 2 + 50
  if (y >= bbY && y <= bbY + 45) {
    if (x >= 30 && x <= 30 + (W - 80) / 2) { state = 'themes'; return }
    if (x >= W / 2 + 10 && x <= W / 2 + 10 + (W - 80) / 2) { state = 'leaderboard'; return }
  }
}

function handlePlayClick(x, y) {
  const ibY = boardTop + boardH + 5
  const ibW = (boardW - 8) / 3
  const ibH = Math.min(42, itemBarH - 6)
  const itemKeys = ['hammer', 'shuffle', 'lightning']
  for (let i = 0; i < 3; i++) {
    const ix = boardX + i * (ibW + 4)
    if (x >= ix && x <= ix + ibW && y >= ibY && y <= ibY + ibH) {
      useItemAction(itemKeys[i]); return
    }
  }
  const bbY = ibY + ibH + 4
  if (x >= margin && x <= margin + 65 && y >= bbY && y <= bbY + backBtnH) {
    state = 'menu'; return
  }
  const col = Math.floor((x - boardX - cellGap) / (cellW + cellGap))
  if (col >= 0 && col < COLS && y >= boardTop && y <= boardTop + boardH) {
    doDrop(col)
  }
}

function handleItemSelectClick(x, y) {
  // Cancel button
  const ibY = boardTop + boardH + 5
  const ibH = Math.min(42, itemBarH - 6)
  const bbY = ibY + ibH + 4
  if (x >= margin && x <= margin + 65 && y >= bbY && y <= bbY + backBtnH) {
    // Refund item
    S.addItem(itemSelectType, 1)
    itemSelectType = null; state = 'playing'; return
  }
  // Board cell
  const col = Math.floor((x - boardX - cellGap) / (cellW + cellGap))
  const row = Math.floor((y - boardTop - cellGap) / (cellH + cellGap))
  if (col >= 0 && col < COLS && row >= 0 && row < ROWS && grid.cells[row][col] > 0) {
    doItemTarget(row, col)
  }
}

function handleGameOverClick(x, y) {
  const cy = H / 2 - 100
  const bw = 125, bh = 44
  const daily = mode === 'daily' ? S.getDaily() : null
  const canContinue = mode === 'daily' && !daily.completed && (dailyExpandedRow === false || dailyExpandedCol === false)

  if (canContinue) {
    // Continue button (center)
    if (x >= W / 2 - bw / 2 && x <= W / 2 + bw / 2 && y >= cy + 165 && y <= cy + 165 + bh) {
      // Watch ad (placeholder) then expand
      if (!dailyExpandedRow && !dailyExpandedCol) {
        // First time: expand row by default (could let player choose, but keep simple)
        dailyContinue('row')
      } else if (dailyExpandedRow && !dailyExpandedCol) {
        dailyContinue('col')
      } else if (!dailyExpandedRow && dailyExpandedCol) {
        dailyContinue('row')
      }
      return
    }
  } else {
    // 再來一局
    if (x >= W / 2 - bw - 8 && x <= W / 2 - 8 && y >= cy + 165 && y <= cy + 165 + bh) {
      if (mode === 'daily') {
        const d = S.getDaily()
        if (!d.completed && d.attempts > 0) startGame('daily')
        else state = 'menu'
      } else startGame('endless')
      return
    }
    // 回菜單
    if (x >= W / 2 + 8 && x <= W / 2 + 8 + bw && y >= cy + 165 && y <= cy + 165 + bh) {
      state = 'menu'; return
    }
  }
}

function handleBackOnly(x, y) {
  if (y >= H - 65 && y <= H - 20) { state = 'menu'; return }
}

function handleThemesClick(x, y) {
  // Back
  if (y >= H - 65 && y <= H - 20) { state = 'menu'; return }
  // Theme buttons
  const unlocked = S.getUnlockedThemes()
  const startY = 70, cols = 2, bw = (W - 50) / 2, bh = 80
  for (let i = 0; i < THEMES.length; i++) {
    const col = i % cols, row = Math.floor(i / cols)
    const tx = 15 + col * (bw + 20), ty = startY + row * (bh + 10)
    if (x >= tx && x <= tx + bw && y >= ty && y <= ty + bh) {
      if (unlocked.includes(THEMES[i].id)) {
        S.setTheme(THEMES[i].id)
        addToast(`切換至 ${THEMES[i].name}`, '🎨')
      } else {
        addToast(`需要 ${THEMES[i].rainbow} 👑 解鎖`, '🔒')
      }
      return
    }
  }
}

// ===== TOUCH & CLICK EVENTS =====
canvas.addEventListener('touchstart', e => {
  e.preventDefault()
  const touch = e.touches[0]
  touchStartY = touch.clientY
  handleTouchMove(touch.clientX, touch.clientY)
}, { passive: false })

canvas.addEventListener('touchmove', e => {
  e.preventDefault()
  const touch = e.touches[0]
  handleTouchMove(touch.clientX, touch.clientY)
}, { passive: false })

canvas.addEventListener('touchend', e => {
  e.preventDefault()
  lastTouchCol = -1; lastTouchCell = null
}, { passive: false })

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect()
  handleClick(e.clientX - rect.left, e.clientY - rect.top)
})

function handleTouchMove(x, y) {
  if (state === 'playing' || state === 'item_select') {
    lastTouchCol = Math.floor((x - boardX - cellGap) / (cellW + cellGap))
    const row = Math.floor((y - boardTop - cellGap) / (cellH + cellGap))
    lastTouchCell = (lastTouchCol >= 0 && lastTouchCol < COLS && row >= 0 && row < ROWS) ? { r: row, c: lastTouchCol } : null
  }
  if (state === 'playing' && y - touchStartY > 50) {
    const col = Math.floor((x - boardX - cellGap) / (cellW + cellGap))
    if (col >= 0 && col < COLS) doDrop(col)
    touchStartY = y
  }
}

// Keyboard support
document.addEventListener('keydown', e => {
  if (state !== 'playing') return
  const col = parseInt(e.key) - 1
  if (col >= 0 && col < COLS) doDrop(col)
  if (e.key === 'Escape') state = 'menu'
})

// ===== MAIN LOOP =====
function drawAll() {
  const t = getTheme()
  ctx.clearRect(0, 0, W, H)

  if (state === 'menu') drawMenu(t)
  else if (state === 'playing' || state === 'item_select') drawGameScreen(t)
  else if (state === 'gameover') drawGameOver(t)
  else if (state === 'leaderboard') drawLeaderboard(t)
  else if (state === 'themes') drawThemes(t)

  particles.update()
  particles.draw(ctx)
  drawToasts(t)

  requestAnimationFrame(drawAll)
}
drawAll()
</script>
</body>
</html>
